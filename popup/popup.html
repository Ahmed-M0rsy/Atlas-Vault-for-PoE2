<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="av-header">
      <div class="av-header-left">
        <div id="av-logo">⚗️ Atlas Vault</div>
        <div id="av-subtitle">PoE2 Build Manager</div>
      </div>
      <div class="av-header-actions">
        <button id="av-export-btn" class="av-hdr-btn" title="Export all builds, folders & settings">📤 Export</button>
        <button id="av-import-btn" class="av-hdr-btn" title="Import builds, folders & settings">📥 Import</button>
      </div>
    </header>

    <!-- Save + folder select -->
    <div id="av-save-bar">
      <button id="av-save-btn">💾 Save Current Build</button>
      <select id="av-save-folder" title="Save into folder">
        <option value="">No folder</option>
      </select>
    </div>

    <!-- Search -->
    <div id="av-search-bar">
      <input type="search" id="av-search" placeholder="🔍 Search builds…" aria-label="Search builds" />
    </div>

    <!-- Sort + Zoom toolbar -->
    <div id="av-toolbar">
      <select id="av-sort" title="Sort builds">
        <option value="manual">⇅ Manual</option>
        <option value="newest">🕘 Newest</option>
        <option value="oldest">🕰️ Oldest</option>
        <option value="az">🔤 A–Z</option>
        <option value="za">🔤 Z–A</option>
      </select>
      <div id="av-zoom-controls" title="Resize UI elements and font">
        <button id="av-zoom-out" title="Zoom out (smaller UI & font)">A−</button>
        <span id="av-zoom-label" title="Double-click to reset to 100%">100%</span>
        <button id="av-zoom-in" title="Zoom in (larger UI & font)">A＋</button>
      </div>
    </div>

    <!-- New folder -->
    <div id="av-new-folder-bar">
      <input type="text" id="av-new-folder-input" placeholder="New folder name…" maxlength="40" aria-label="New folder name" />
      <button id="av-new-folder-btn" title="Create folder">＋</button>
    </div>

    <!-- Tree view -->
    <div id="av-tree" role="tree" aria-label="Saved builds"></div>
  </div>

  <!-- Move modal -->
  <div id="av-modal" class="av-hidden" role="dialog" aria-modal="true" aria-label="Move build to folder">
    <div id="av-modal-box">
      <h4>Move to Folder</h4>
      <select id="av-modal-folder"></select>
      <div id="av-modal-actions">
        <button id="av-modal-cancel">Cancel</button>
        <button id="av-modal-confirm">Move</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="av-toast"></div>

  <script src="popup.js"></script>
</body>
</html>
